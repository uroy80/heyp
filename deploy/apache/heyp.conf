# heyp behind Apache httpd 2.4 on the host, with Cloudflare in front — plain HTTP (port 80): a redirect only.
# The HTTPS site is ssl-heyp.conf next to this file. Install both as described in deploy/DEPLOY.md §5:
#
#   sudo install -m 644 deploy/apache/heyp.conf /etc/httpd/conf.d/zz-heyp.conf
#
# The "zz-" prefix loads heyp after the sites already on the server, so it never becomes the first (default) vhost
# Apache answers for unknown host names; check with `sudo httpd -S` that the defaults are still your existing sites.
#
# Every heyp vhost has its OWN CustomLog and ErrorLog: a vhost without them writes to the server-wide access_log in the
# "combined" format (browser type, referrer, query strings), and legal/privacy.md promises we keep none of those.
# Keep the format in sync with ssl-heyp.conf and the privacy policy (tests/test_legal.py checks all three).

<VirtualHost *:80>
    ServerName heyp.edgr.in

    # The visitor's address (not Cloudflare's) in the log: see ssl-heyp.conf.
    RemoteIPHeader CF-Connecting-IP
    Include /etc/httpd/conf.d/heyp-cloudflare-ips.inc

    CustomLog /var/log/httpd-heyp/access.log "%a [%{%Y-%m-%dT%H:%M:%S%z}t] %V \"%m %U\" %>s %B %D"
    ErrorLog /var/log/httpd-heyp/error.log
    ErrorLogFormat "[%{cu}t] [%-m:%l] [client\ %a] %M"
    LogLevel warn

    # Path and query string are kept (Cloudflare's "Always Use HTTPS" normally answers this before it gets here).
    Redirect permanent / https://heyp.edgr.in/
</VirtualHost>
