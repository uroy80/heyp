[pytest]
testpaths = tests
pythonpath = .
# tests.test_models_required doubles as a plugin: with HEYP_REQUIRE_MODELS=1 (dev image) model skips fail.
addopts = -p no:cacheprovider -p tests.test_models_required
markers =
    services: needs the real renderer container (HEYP_RENDERER_TEST_SOCKET); CI runs them with -m services
filterwarnings =
    ignore:Using .httpx. with .starlette.testclient. is deprecated
