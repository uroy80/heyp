# Models: rebuild the ONNX models heyp exports itself (Real-ESRGAN byte for byte against the pins, BiRefNet by
# parity with PyTorch) and attach those the models-v1 release is still missing; third-party models come from
# their upstream URLs. A newly attached BiRefNet is the canonical copy: pin its sha256/size (printed in the run
# summary) in scripts/fetch_models.py and scripts/export_models/SHA256SUMS. Run it by hand after a pin changes or when an asset is missing:
#   Actions → Models → Run workflow   (or: gh workflow run models.yml)
# Image builds download from that release (scripts/fetch_models.py), so nothing here touches the images.
name: Models

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: models
  cancel-in-progress: false

jobs:
  attach:
    if: github.repository == 'uroy80/heyp'
    name: Export and attach missing models
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write # upload release assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Export heyp's own models (Real-ESRGAN byte for byte, BiRefNet by parity with PyTorch)
        run: sh scripts/export_models/export_all.sh "$RUNNER_TEMP/models"
      - name: Attach what models-v1 is missing
        env:
          GH_TOKEN: ${{ github.token }}
          MODELS: ${{ runner.temp }}/models
        run: |
          set -euo pipefail
          have=$(gh release view models-v1 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | select(.state == "uploaded") | .name')
          for f in "$MODELS"/realesr-*.onnx "$MODELS"/birefnet-*.onnx; do
            name=$(basename "$f")
            if grep -qxF "$name" <<<"$have"; then
              echo "present: $name"
            else
              gh release upload models-v1 "$f" --repo "$GITHUB_REPOSITORY" --clobber
              echo "attached: $name sha256=$(sha256sum "$f" | cut -d' ' -f1) bytes=$(wc -c <"$f")" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          done
